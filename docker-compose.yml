
services:
  frontend:
    image: 616150220810.dkr.ecr.us-east-1.amazonaws.com/docker-ecr:frontend-${IMAGE_TAG}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - my-custom-network
    restart: unless-stopped

  backend:
    image: 616150220810.dkr.ecr.us-east-1.amazonaws.com/docker-ecr:backend-${IMAGE_TAG}
    ports:
      - "5001:5000"
    environment:
      DB_HOST: database
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: ${DB_PORT}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - my-custom-network
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - my-custom-network

volumes:
  pgdata:

networks:
  my-custom-network:
    driver: bridge
